<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <title>Page not found — CloudCanvas</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .not-found {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px;
        }

        .not-found-card {
            width: min(100%, 550px);
            padding: clamp(30px, 8vw, 64px);
            border: 1px solid #e4e7df;
            border-radius: 10px;
            background: #fff;
            text-align: center;
        }

        .not-found-mark {
            width: 60px;
            height: 60px;
            display: grid;
            place-items: center;
            margin: 0 auto 25px;
            border-radius: 17px;
            background: #d6fb57;
            font-family: "Space Grotesk", sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .not-found-card .eyebrow {
            justify-content: center;
        }

        .not-found-card h1 {
            margin: 22px 0 14px;
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(40px, 10vw, 58px);
            letter-spacing: -3px;
            line-height: 1;
        }

        .not-found-card p {
            margin: 0 auto 25px;
            color: #666c61;
            font-size: 14px;
            line-height: 1.75;
        }
    </style>
</head>
<body>
    <main class="not-found">
        <section class="not-found-card">
            <div class="not-found-mark" aria-hidden="true">↗</div>
            <div class="eyebrow"><span class="eyebrow-dot"></span> WRONG TURN, RIGHT PLACE</div>
            <h1>Page not found.</h1>
            <p>That address doesn't point to a page on this site. Let's get you back to something that does.</p>
            <a class="button button-dark" href="/">Back to the homepage <span aria-hidden="true">↗</span></a>
        </section>
    </main>
</body>
</html>
